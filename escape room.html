<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room</title>
</head>
<body style="margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background: #1f1f1f; color: #ffffff; min-height:100vh;">
  <!-- Landing (Generator intro) -->
  <div id="landing"
    style="
      background-image: url('https://lms.latrobe.edu.au/draftfile.php/12009979/user/draft/845876172/treasure-map.png?time=1762479548825');
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      outline: 2px solid red;
      width: 98%;
      height: 65vh;
      margin: 5vh auto;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    "
  >
    <div>
      <div style="color: rgba(255, 255, 255, 1); 
        margin-bottom: 16px;          
        border: 2px solid;
        border-color: #EBB800;
        background-color: rgba(108, 84, 1, 0.5);
        border-radius: 8px;
        padding: 12px 20px;
        font-weight: 900;">
        ESCAPE ROOM GENERATOR
      </div>

      <button id="btnCreate"
        style="
          background: #EBB800;
          color: #ffffff;
          border: none;
          border-radius: 8px;
          padding: 12px 20px;
          font-weight: 700;
          cursor: pointer;
        "
      >
        Create Room
      </button>
    </div>
  </div>

  <!-- Editor container (hidden initially) -->
  <div id="editor"
    style="
      display: none;
      width: 98%;
      height: 65vh;
      margin: 5vh auto;
      border-radius: 8px;
      outline: 2px solid red;
      background: #202020;
      padding: 12px;
      position: relative;
      overflow: hidden;
      font-size: clamp(10px, 1.1vw, 14px);
    "
  >
    <!-- Room Editor (click to plot) -->
    <div id="roomEditor" style="width:100%; height:100%; position:relative; cursor:crosshair;">
      <div style="font-weight:900; color:#EBB800; margin-bottom:0.4em; font-size:1.05em; letter-spacing:0.4px; text-align:center;">ROOM EDITOR</div>

      <!-- Clickable area for plotting -->
      <div id="editorClickArea" style="position:absolute; inset:0; z-index:1; cursor:crosshair;"></div>

      <!-- Container for plotted circles -->
      <div id="plottedCircles" style="position:absolute; inset:0; z-index:2; pointer-events:none;"></div>

      <!-- Requirement box -->
      <div
        id="requirementBox"
        style="
          position:absolute;
          top:6px;
          left:10px;
          width:16%;
          min-width:140px;
          max-width:200px;
          background:#1a1a1a;
          border:1px solid #333;
          border-radius:0.4em;
          padding:0.6em;
          text-align:left;
          z-index:20;
          pointer-events:auto;
        "
      >
        <div style="font-weight:800; color:#fff; font-size:0.9em; margin-bottom:0.5em; text-align:center;">Requirement:</div>
        <div id="req-line-has-icon" style="font-size:0.8em; margin-bottom:0.35em; color:#dc3545;">
          • Click & Edit at least 1 Icon
        </div>
      </div>
    </div>

    <!-- Bottom-right controls -->
    <div id="editorControls" style="position:absolute; right:12px; bottom:12px; display:flex; gap:8px; font-size:1em; z-index:20;">
      <button id="btnBack"
        style="
          background: transparent; color: #ffffff; border: 1px solid #777; border-radius: 0.4em; padding: 0.5em 0.8em; font-weight: 700; cursor: pointer; font-size:0.9em;"
      >Back</button>
      <button id="btnNext"
        style="
          background:#EBB800; color:#111; border: none; border-radius: 0.4em; padding: 0.5em 0.8em; font-weight: 800; cursor: pointer; font-size:0.9em;"
      >Next</button>
    </div>
  </div>

  <!-- Question Modal (hidden by default) -->
  <div id="questionModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#2a2a2a; border:2px solid red; border-radius:8px; padding:20px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; position:relative;">
      <div style="font-weight:900; color:#EBB800; margin-bottom:12px; font-size:1.1em; text-align:center;">Edit Question</div>
      
      <div style="margin-bottom:12px;">
        <label style="display:block; color:#fff; font-size:0.9em; margin-bottom:6px; font-weight:700;">Question:</label>
        <textarea id="modalQuestion" placeholder="Enter your question here..." style="width:100%; min-height:80px; background:#1a1a1a; color:#fff; border:1px solid #555; border-radius:6px; padding:10px; font-size:0.9em; resize:vertical; box-sizing:border-box;"></textarea>
      </div>
      
      <div style="margin-bottom:16px;">
        <label style="display:block; color:#fff; font-size:0.9em; margin-bottom:6px; font-weight:700;">Answer:</label>
        <textarea id="modalAnswer" placeholder="Enter the expected answer here..." style="width:100%; min-height:60px; background:#1a1a1a; color:#fff; border:1px solid #555; border-radius:6px; padding:10px; font-size:0.9em; resize:vertical; box-sizing:border-box;"></textarea>
      </div>
      
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button id="modalCancel" style="background:transparent; color:#fff; border:1px solid #777; border-radius:6px; padding:8px 16px; font-weight:700; cursor:pointer; font-size:0.9em;">Cancel</button>
        <button id="modalSave" style="background:#EBB800; color:#111; border:none; border-radius:6px; padding:8px 16px; font-weight:800; cursor:pointer; font-size:0.9em;">Save</button>
      </div>
    </div>
  </div>

  <!-- Timer Modal (hidden by default) -->
  <div id="timerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#2a2a2a; border:2px solid red; border-radius:8px; padding:20px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; position:relative;">
      <div style="font-weight:900; color:#EBB800; margin-bottom:12px; font-size:1.1em; text-align:center;">Select time to complete this room</div>
      
      <div style="display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:16px;">
        <div style="display:flex; gap:0.6em; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:0.5em;">
          <button id="timerOpt5"
            style="
              background:#333; color:#fff; border:1px solid #666; border-radius:0.5em; padding:0.6em 0.9em; cursor:pointer; font-size:1em; font-weight:700; display:inline-block;"
          >5 min</button>
          <button id="timerOpt10"
            style="
              background:#333; color:#fff; border:1px solid #666; border-radius:0.5em; padding:0.6em 0.9em; cursor:pointer; font-size:1em; font-weight:700; display:inline-block;"
          >10 min</button>
        </div>

        <div style="font-size:0.9em; color:#ccc; margin:0.4em 0;">OR</div>

        <div style="font-size:0.9em; color:#ccc; margin:0.3em 0;">Custom Timer (max 1800 seconds)</div>
        <input id="timerCustomSec" type="number" min="1" max="1800" placeholder="e.g., 600"
          style="
            width:8em; background:#1a1a1a; color:#fff; border:1px solid #555; border-radius:0.4em; padding:0.5em 0.6em; font-size:0.95em; margin-bottom:0.4em; text-align:center;"
        >
        <div id="timerModalMsg" style="color:#bbb; font-size:0.85em; min-height:1.2em;">&nbsp;</div>
      </div>
      
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button id="timerModalCancel" style="background:transparent; color:#fff; border:1px solid #777; border-radius:6px; padding:8px 16px; font-weight:700; cursor:pointer; font-size:0.9em;">Cancel</button>
        <button id="timerModalSave" style="background:#EBB800; color:#111; border:none; border-radius:6px; padding:8px 16px; font-weight:800; cursor:pointer; font-size:0.9em;">Save</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var btn = document.getElementById('btnCreate');
      var landing = document.getElementById('landing');
      var editor = document.getElementById('editor');
      var btnBack = document.getElementById('btnBack');
      var btnNext = document.getElementById('btnNext');
      var roomEditor = document.getElementById('roomEditor');

      // Timer modal controls
      var timerModal = document.getElementById('timerModal');
      var timerOpt5 = document.getElementById('timerOpt5');
      var timerOpt10 = document.getElementById('timerOpt10');
      var timerCustomSec = document.getElementById('timerCustomSec');
      var timerModalMsg = document.getElementById('timerModalMsg');
      var timerModalSave = document.getElementById('timerModalSave');
      var timerModalCancel = document.getElementById('timerModalCancel');
      var selectedSeconds = null;

      function setTimerActive(button){
        if(!timerOpt5 || !timerOpt10) return;
        timerOpt5.style.background = '#333'; timerOpt5.style.borderColor = '#666'; timerOpt5.style.color = '#fff';
        timerOpt10.style.background = '#333'; timerOpt10.style.borderColor = '#666'; timerOpt10.style.color = '#fff';
        if(button){ button.style.background = '#EBB800'; button.style.borderColor = '#EBB800'; button.style.color = '#111'; }
      }

      function showTimerModal(){
        selectedSeconds = null;
        setTimerActive(null);
        if(timerCustomSec) timerCustomSec.value = '';
        if(timerModalMsg) timerModalMsg.textContent = '';
        timerModal.style.display = 'flex';
      }

      function hideTimerModal(){
        timerModal.style.display = 'none';
      }

      if(timerOpt5){ timerOpt5.addEventListener('click', function(){ selectedSeconds = 5*60; setTimerActive(timerOpt5); if(timerCustomSec) timerCustomSec.value=''; if(timerModalMsg) timerModalMsg.textContent = '(300 seconds)'; }); }
      if(timerOpt10){ timerOpt10.addEventListener('click', function(){ selectedSeconds = 10*60; setTimerActive(timerOpt10); if(timerCustomSec) timerCustomSec.value=''; if(timerModalMsg) timerModalMsg.textContent = '(600 seconds)'; }); }
      if(timerCustomSec){ timerCustomSec.addEventListener('input', function(){ setTimerActive(null); var v = parseInt(timerCustomSec.value||'0',10); if(!isNaN(v)){ selectedSeconds = v; if(timerModalMsg) timerModalMsg.textContent = '('+v+' seconds)'; } else { selectedSeconds = null; if(timerModalMsg) timerModalMsg.textContent=''; } }); }

      if(timerModalSave){ timerModalSave.addEventListener('click', function(){
        if(selectedSeconds === null || selectedSeconds <= 0){ alert('Please select a timer or enter custom seconds.'); return; }
        if(selectedSeconds > 1800){ alert('Maximum allowed is 1800 seconds.'); return; }
        hideTimerModal();
        alert('Timer saved: ' + selectedSeconds + ' seconds. Proceeding to next step (to be implemented).');
      }); }

      if(timerModalCancel){ timerModalCancel.addEventListener('click', hideTimerModal); }

      if(btn){ btn.addEventListener('click', function(){
        if(landing) landing.style.display = 'none';
        if(editor) {
          editor.style.display = 'block';
          editor.style.visibility = 'visible';
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }); }

      if(btnBack){ btnBack.addEventListener('click', function(){
        editor.style.display = 'none';
        landing.style.display = 'flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }); }

      if(btnNext){ btnNext.addEventListener('click', function(){
        showTimerModal();
      }); }

      // Question modal
      var modal = document.getElementById('questionModal');
      var modalQuestion = document.getElementById('modalQuestion');
      var modalAnswer = document.getElementById('modalAnswer');
      var modalSave = document.getElementById('modalSave');
      var modalCancel = document.getElementById('modalCancel');
      var circleData = {}; // {circleId: {x, y, question, answer}, ...}
      var currentCircleId = null;
      var circleCounter = 0;
      var plottedCircles = document.getElementById('plottedCircles');
      var editorClickArea = document.getElementById('editorClickArea');
      var tempCircle = null; // Temporary circle before saving

      function showModal(circleId, x, y){
        currentCircleId = circleId;
        modalQuestion.value = (circleData[circleId] && circleData[circleId].question) || '';
        modalAnswer.value = (circleData[circleId] && circleData[circleId].answer) || '';
        modal.style.display = 'flex';
      }

      function hideModal(){
        modal.style.display = 'none';
        currentCircleId = null;
      }

      function createCircle(x, y, isTemporary){
        var circleId = 'circle' + (++circleCounter);
        var circleSize = 30; // Slightly bigger than cursor
        var circle = document.createElement('div');
        circle.id = circleId;
        circle.style.position = 'absolute';
        circle.style.left = (x - circleSize/2) + 'px';
        circle.style.top = (y - circleSize/2) + 'px';
        circle.style.width = circleSize + 'px';
        circle.style.height = circleSize + 'px';
        circle.style.borderRadius = '50%';
        circle.style.border = '2px solid rgba(255,255,255,0.8)';
        circle.style.backgroundColor = isTemporary ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.5)';
        circle.style.cursor = 'pointer';
        circle.style.pointerEvents = 'auto';
        circle.style.zIndex = '3';
        
        if(isTemporary){
          tempCircle = circle;
        } else {
          // Make saved circles clickable to edit
          circle.addEventListener('click', function(ev){
            ev.stopPropagation();
            var circleRect = circle.getBoundingClientRect();
            var editorRect = roomEditor.getBoundingClientRect();
            var circleX = circleRect.left - editorRect.left + circleRect.width/2;
            var circleY = circleRect.top - editorRect.top + circleRect.height/2;
            showModal(circleId, circleX, circleY);
          });
        }
        
        plottedCircles.appendChild(circle);
        return circle;
      }

      function saveCircle(circleId, x, y, question, answer){
        if(!circleData[circleId]) circleData[circleId] = {};
        circleData[circleId].x = x;
        circleData[circleId].y = y;
        circleData[circleId].question = question;
        circleData[circleId].answer = answer;
        
        // Update the circle to be permanent (more visible) and clickable
        var circle = document.getElementById(circleId);
        if(circle){
          circle.style.backgroundColor = 'rgba(255,255,255,0.5)';
          circle.style.border = '2px solid rgba(255,255,255,0.9)';
          
          // Remove any existing click handlers and add new one for editing
          var newCircle = circle.cloneNode(true);
          circle.parentNode.replaceChild(newCircle, circle);
          newCircle.addEventListener('click', function(ev){
            ev.stopPropagation();
            showModal(circleId, x, y);
          });
        }
        tempCircle = null;
      }

      if(modalSave){ modalSave.addEventListener('click', function(){
        if(!currentCircleId) return;
        var q = (modalQuestion.value||'').trim();
        var a = (modalAnswer.value||'').trim();
        if(!q || !a){ alert('Please fill both question and answer.'); return; }
        
        var circle = document.getElementById(currentCircleId);
        if(circle){
          var rect = circle.getBoundingClientRect();
          var editorRect = roomEditor.getBoundingClientRect();
          var x = rect.left - editorRect.left + rect.width/2;
          var y = rect.top - editorRect.top + rect.height/2;
          saveCircle(currentCircleId, x, y, q, a);
        }
        
        hideModal();
        setReqLine(true); // mark requirement as met
      }); }

      if(modalCancel){ modalCancel.addEventListener('click', function(){
        // Remove temporary circle if it exists
        if(tempCircle && tempCircle.id === currentCircleId){
          tempCircle.remove();
          tempCircle = null;
        }
        hideModal();
      }); }

      // Requirement status: green once any circle has question/answer
      var reqLineHasIcon = document.getElementById('req-line-has-icon');
      function setReqLine(ok){ if(!reqLineHasIcon) return; reqLineHasIcon.style.color = ok ? '#28a745' : '#dc3545'; }

      // Click to plot functionality
      if(editorClickArea){
        editorClickArea.addEventListener('click', function(ev){
          // Don't create circle if clicking on requirement box, buttons, or existing circles
          var target = ev.target;
          var requirementBox = document.getElementById('requirementBox');
          var editorControls = document.getElementById('editorControls');
          
          // Check if click is on buttons or requirement box
          if(target.closest('button') || target.closest('#requirementBox') || target.closest('#editorControls')) return;
          
          // Check if click is within requirement box bounds
          if(requirementBox){
            var reqRect = requirementBox.getBoundingClientRect();
            if(ev.clientX >= reqRect.left && ev.clientX <= reqRect.right && 
               ev.clientY >= reqRect.top && ev.clientY <= reqRect.bottom){
              return;
            }
          }
          
          // Check if click is within button controls bounds
          if(editorControls){
            var controlsRect = editorControls.getBoundingClientRect();
            if(ev.clientX >= controlsRect.left && ev.clientX <= controlsRect.right && 
               ev.clientY >= controlsRect.top && ev.clientY <= controlsRect.bottom){
              return;
            }
          }
          
          // Check if clicking on existing circles
          if(target.closest('#plottedCircles > div')) return;
          
          var rect = editorClickArea.getBoundingClientRect();
          var x = ev.clientX - rect.left;
          var y = ev.clientY - rect.top;
          
          // Create temporary circle (counter is incremented inside createCircle)
          var newCircleId = 'circle' + (circleCounter + 1);
          var circle = createCircle(x, y, true);
          var actualCircleId = circle.id;
          
          // Open modal immediately
          showModal(actualCircleId, x, y);
        });
      }
    })();
  </script>
</body>
</html>
